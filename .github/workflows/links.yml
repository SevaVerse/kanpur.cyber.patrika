name: Link Check

# Publisher URLs rot. A dead outbound link in an old briefing costs reader
# trust and quality signals, so check the built site weekly. Report-only: a
# broken third-party link should never block a deploy.
on:
  schedule:
    # 03:30 UTC Monday = 09:00 IST Monday, after the Saturday edition settles.
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          NEXT_PUBLIC_SITE_URL: https://cybervani.com
        run: npm run build

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/out
            --exclude-path out/_next
            --accept 200..=299,403,429,999
            --max-concurrency 8
            --timeout 20
            'out/**/*.html'
          fail: false
          jobSummary: true
