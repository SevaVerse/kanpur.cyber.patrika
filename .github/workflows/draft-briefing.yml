name: Publish Weekly Briefing

# Fully automated. Every Saturday morning IST the pipeline collects the week's
# cyber security headlines, reads each source article, writes a take grounded
# in that article, links the story to the matching guide in the awareness
# library, and commits. The commit to main triggers deploy.yml.
#
# Any take that cannot be verified against its source is dropped rather than
# guessed, so a bad week produces a thinner briefing, never a wrong one.
on:
  schedule:
    # 01:30 UTC Saturday = 07:00 IST Saturday
    - cron: "30 1 * * 6"
  workflow_dispatch:
    inputs:
      date:
        description: "Briefing date (YYYY-MM-DD). Defaults to the next Saturday."
        required: false

permissions:
  contents: write
  # Needed to dispatch deploy.yml below. A push made with GITHUB_TOKEN does not
  # trigger other workflows (GitHub prevents recursion), so without an explicit
  # dispatch the briefing would be committed every week and never published.
  actions: write

concurrency:
  group: publish-briefing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No token in .git/config while npm ci runs dependency scripts.
          # The push step below supplies it for that one command only.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The validators are what keep invented figures and contact details out
      # of the takes. Never publish with them broken.
      - name: Test
        run: npm test

      - name: Generate briefing
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          NEWSAPI_ORG_KEY: ${{ secrets.NEWSAPI_ORG_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          # Passed through the environment, never interpolated into the
          # script, so the input cannot inject shell.
          BRIEFING_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$BRIEFING_DATE" ]; then
            node scripts/draft-briefing.mjs --date "$BRIEFING_DATE" --force
          else
            node scripts/draft-briefing.mjs --force
          fi

      - name: Verify the site still builds with the new briefing
        env:
          NEXT_PUBLIC_SITE_URL: https://cybervani.com
        run: npm run build

      - name: Commit and push
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain src/content/briefings)" ]; then
            echo "No briefing changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "cyber-vani-bot"
          git config user.email "noreply@cybervani.com"
          git add src/content/briefings
          git commit -m "content: weekly briefing $(date -u +%Y-%m-%d)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy the new briefing
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The push above cannot trigger deploy.yml on its own, so ask for it
        # explicitly. Without this the site silently serves last week's edition.
        run: gh workflow run deploy.yml --ref main
