name: Deploy Static Site

# Deploys on push. The site no longer fetches news at build time, so there is
# nothing for a scheduled rebuild to pick up — briefings are committed content.
# The weekly draft is prepared by draft-briefing.yml instead.
#
# Two jobs, on purpose. `build` runs `npm ci`, which executes every
# dependency's install scripts, so it gets a read-only token and no persisted
# git credentials. `deploy` holds the write token but never runs npm: it only
# publishes the artifact `build` produced.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A push and a dispatched deploy can otherwise race, and both force-push
# gh-pages. Queue them instead; the newest one wins.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build static site
        env:
          NEXT_PUBLIC_FORMSPREE_ENDPOINT: ${{ secrets.NEXT_PUBLIC_FORMSPREE_ENDPOINT }}
          NEXT_PUBLIC_EDITOR_EMAIL: ${{ secrets.NEXT_PUBLIC_EDITOR_EMAIL }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_SITE_URL: https://cybervani.com
        run: npm run build

      - name: Add .nojekyll to prevent GitHub Pages Jekyll processing
        run: touch ./out/.nojekyll

      - name: Upload site artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: out

      - name: Deploy out directory to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
