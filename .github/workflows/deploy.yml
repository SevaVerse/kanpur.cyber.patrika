name: Deploy Static Site

# Deploys on push. The site no longer fetches news at build time, so there is
# nothing for a scheduled rebuild to pick up — briefings are committed content.
# The weekly draft is prepared by draft-briefing.yml instead.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static site
        env:
          NEXT_PUBLIC_FORMSPREE_ENDPOINT: ${{ secrets.NEXT_PUBLIC_FORMSPREE_ENDPOINT }}
          NEXT_PUBLIC_EDITOR_EMAIL: ${{ secrets.NEXT_PUBLIC_EDITOR_EMAIL }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_SITE_URL: https://cybervani.com
        run: npm run build

      - name: Add .nojekyll to prevent GitHub Pages Jekyll processing
        run: touch ./out/.nojekyll

      - name: Deploy out directory to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
