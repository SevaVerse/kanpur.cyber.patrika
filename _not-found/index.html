protection KUALA LUMPUR, Malaysia , Sept. 11, 2026 /PRNewswire/ -- The Cyber Digital Services, Defence \u0026 Security Asia (CyberDSA) 2026 Conference will convene senior government, cybersecurity, defence, finance and technology leaders in Kuala Lumpur from 5-7 October 2026 to address the most urgent security challenges of an AI-driven, digitally dependent world. From emerging threats and digital resilience to innovation and future technologies CyberDSA 2026 is the platform to lead the conversation and engage with a highly targeted audience from across the region. From rogue AI models and digital sovereignty to cyber conflict and the protection of financial, energy and national infrastructure, the three-day programme places national and corporate resilience at the centre of the regional security agenda. With just weeks to go before its fourth edition opens at MITEC Kuala Lumpur, CyberDSA 2026 will bring together an exceptional line-up of government leaders, cybersecurity authorities, regulators, defence practitioners, technology experts, and industry decision-makers from Malaysia and around the world. Held in partnership with Asia Collective, the conference is built around three strategic pillars: The Future of Digital Trust, Defending Digital Battlespace, and Protecting National Critical Infrastructure. Among the leaders taking the stage are YB Gobind Singh Deo, Minister of Digital Malaysia; H.E. Dr Mohamed Al Kuwaiti, Head of Cybersecurity for the UAE Government, UAE Cybersecurity Council and Orhan Osmani, Head of the Cybersecurity Division at the International Telecommunications Union (ITU). They will be joined by senior representatives and experts from organisations including Google, CyberSecurity Malaysia, National Cyber Security Agency (NACSA), the Malaysian Armed Forces, the Indonesian Navy Staff, and Command School, CIDB Malaysia, the Malaysian Oil, Gas, \u0026 Energy Services Council (MOGSC), alongside international and regional voices spanning cybersecurity, defence, energy, technology, and strategic affairs. The calibre and breadth of the programme reflect how far cybersecurity has moved beyond the traditional boundaries of IT. AI is creating new capabilities while introducing new attack surfaces and governance challenges. Digital Trust is increasingly tied to economic confidence and national resilience. At the same time, the growing interconnection of financial systems, energy networks, cities and essential services means a cyber incident can quickly become an operational, economic or national security issue. CyberDSA 2026 is powered by a distinguished coalition of industry leaders whose expertise and innovation drive the event forward. Maxis powers the event, joined by gold sponsors DEAS Cyber+ and Splunk, and Silver Sponsors Exabeam, Blackpanda, Menlo Security, Tech Data, MindMatics, Raddish Technology, Aras Integrasi, and Cyber Test Systems. Laurea People's Signature serves as the Official Marketing Technology Partner and Syntx is the Engagement Partner. Together, these partners are actively shaping the conversation, engaging with delegates, and advancing the regional agenda on cybersecurity, digital trust and critical infrastructure resilience. The Future of Digital Trust ( Day 1 - October 5) Day One examines Digital Trust, spanning rogue AI, information integrity, digital identity, data governance and digital sovereignty. H.E. Dr Mohamed Al Kuwaiti, Head of Cybersecurity for the UAE Government, will address the risks posed by rogue AI models and agents, while YB Gobind Singh Deo, Minister of Digital Malaysia, will deliver the CyberDSA 2026 Keynote and Opening Address. The programme also brings together perspectives from Google, NACSA, CyberSecurity Malaysia and MyDigital ID. Defending Digital Battlespace ( Day 2 - October 6) Day Two shifts to cyber defence, exploring AI-powered security, cyber operations, strategic competition and regional cooperation. Speakers include Dr Monisha Oberoi of Google; Captain (N) Bagus Jatmiko of the Indonesian Navy Staff and Command School; Vice Admiral Dato' Pahlawan Shamsuddin Hj Ludin (Retired), former Deputy Chief of Navy; and Derek Grossman of Indo-Pacific Solutions. Day 2 also features the Official Opening Ceremony of Siber Siaga with the theme \"Commanding the Hyperwar: Human Judgement, Machine Speed and Decision Superiority\", followed by the Siber Siaga Forum. Protecting National Critical Infrastructure ( Day 3 - October 7) Day Three focuses on critical infrastructure resilience, spanning finance, energy, smart cities and water security. The programme opens with \"Safeguarding Critical Financial Infrastructure Through Cyber Resilience,\" featuring senior representatives from CyberSecurity Malaysia. Highlights include \"Building Resilient Smart Cities in a Connected World,\" with Suhaimi Mansor, Deputy Chief Executive (Development) of CIDB Malaysia, and Dato' Ts. Dr Haji Amirudin Abdul Wahab, Former Chief Executive Officer of CyberSecurity Malaysia. Joining them is Dato' Sri Ir. Dr. Judin Abdul Karim, Chairman of Muda Consult Sdn Bhd and Former Chief Executive of CIDB Malaysia, bringing decades of leadership in infrastructure standards and industry collaboration. \"Water and National Resilience\" follows, with Captain (N) Bagus Jatmiko (Indonesian Navy Staff and Command School), Dr Chester Cabalza (Founder, International Development and Security Cooperation) and Jonathan Jackson, APAC Field CISO, Secure Communications, BlackBerry on cross-border water security. The day closes with \"Women in Tech: Breaking the Glass Ceiling or Just Breaking In?\" featuring senior representatives from the Ministry of Digital Malaysia, sharing real-world case studies on advancing women's leadership in technology and cybersecurity. Female leaders in cybersecurity discuss digital trust at CyberDSA 2025. The 2026 edition expands this conversation with the forum “Women in Tech: Breaking the Glass Ceiling or Just Breaking In?”, featuring senior representatives from the Ministry of Digital Malaysia and real-world case studies on advancing women’s leadership in technology and cybersecurity. Nadzeem Abdul Rahman, Executive Director of Aerosea Exhibitions Sdn Bhd, organiser of CyberDSA 2026, said: \"The cyber agenda has changed. AI is advancing at extraordinary speed, digital infrastructure is becoming more interconnected, and a cyber incident can now carry consequences far beyond the technology environment, affecting businesses, essential services, economies and national security. \"CyberDSA is bringing the people responsible for these challenges into the same room, from policymakers and cyber authorities to defence leaders, regulators, critical infrastructure operators and technology experts. The calibre of this year's speakers reflects CyberDSA's role as the region's premier platform for high-stakes cyber and digital security dialogue.\" CyberDSA 2026 is expected to welcome 9,000 trade professionals from 45 countries, 160 participating companies, 100 speakers and more than 55 cyber leaders from 15 nations through its VIP Delegation Programme. The conference marks the next stage in CyberDSA's evolution as an industry-facing cybersecurity platform, reinforcing Malaysia's position as a hub for regional cyber diplomacy and infrastructure resilience planning. With CyberDSA 2026 now only weeks away, conference delegate, trade visitor and media registrations are open. Professionals seeking full access to the conference can now secure their passes, while professionals and members of the media are invited to register to experience the wider exhibition and programme. Companies seeking to position their capabilities before the industry community gathering in Kuala Lumpur may also contact the Organiser regarding exhibiting and strategic partnership opportunities at CyberDSA 2026. Register now for full conference access of exhibition visits: https://www.cyberdsa.com/ View the full CyberDSA 2026 Conference Programme and Speaker bi
